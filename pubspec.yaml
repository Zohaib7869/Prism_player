name: prism_player
description: A premium offline video and audio media player.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # Routing
  go_router: ^14.2.0

  # Local persistence
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.3
  path: ^1.9.0

  # Secure storage (PIN, sensitive settings)
  flutter_secure_storage: ^9.2.2

  # Biometric auth for Safe Media
  local_auth: ^2.3.0

  # Playback engines
  video_player: ^2.9.1
  # Used only for remote YouTube adaptive playback (720p/1080p = separate
  # video-only + audio-only streams merged at playback time via
  # player.setAudioTrack(AudioTrack.uri(...)) — video_player/ExoPlayer can't
  # do this, but libmpv can). Local file playback still uses video_player
  # above, untouched. Android-only per the app's current target.
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_android_video: ^1.0.4
  just_audio: ^0.9.40
  audio_service: ^0.18.15
  audio_session: ^0.1.21

  # Permissions
  permission_handler: ^11.3.1

  # Device / storage info
  device_info_plus: ^10.1.0

  # UI helpers
  cupertino_icons: ^1.0.8
  shimmer: ^3.0.0
  wakelock_plus: ^1.2.5
  screen_brightness: ^1.0.1
  volume_controller: ^3.3.1
  share_plus: ^12.0.2
  file_picker: ^8.1.2

  # YouTube search + stream resolution (in-app playback)
  youtube_explode_dart: ^3.1.0

  # Utility
  crypto: ^3.0.5
  uuid: ^4.4.0
  rxdart: ^0.28.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/themes/
